[build]
  publish = "."
  functions = "netlify/functions"

# /admin → admin.html
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# Dedicated section pages
[[redirects]]
  from = "/projects"
  to   = "/projects.html"
  status = 200

[[redirects]]
  from = "/quiz"
  to   = "/quiz.html"
  status = 200

[[redirects]]
  from = "/wishlist"
  to   = "/wishlist.html"
  status = 200

# /writing (index of all posts)
[[redirects]]
  from = "/writing"
  to   = "/writing-list.html"
  status = 200

# /writing/[slug] → writing.html (fetches post from Supabase by slug)
[[redirects]]
  from = "/writing/*"
  to   = "/writing.html"
  status = 200

# Prevent caching HTML so Supabase content is always fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

