[build]
  publish = "."           # static files served from repo root
  functions = "netlify/functions"

# Route /admin → admin.html (clean URL)
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# Route /admin/* → admin.html (handles any sub-paths)
[[redirects]]
  from = "/admin/*"
  to   = "/admin.html"
  status = 200

# Cache-control: content.json must NOT be cached aggressively
# so the site always fetches the latest after a redeploy.
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML files: short cache, revalidated on redeploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets: longer cache (fingerprinted in production)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
