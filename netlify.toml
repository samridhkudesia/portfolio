[build]
  publish = "."
  functions = "netlify/functions"

# /admin → admin.html
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# /writing/[slug] → writing.html (which reads the slug from the URL and fetches from Supabase)
# No static per-post files needed — one page handles all posts dynamically
[[redirects]]
  from = "/writing/*"
  to   = "/writing.html"
  status = 200

# Prevent browsers caching HTML files so Supabase content is always fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

