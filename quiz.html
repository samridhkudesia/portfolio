<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Samridh Kudesia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink:#0f0e0d; --sand:#f5f0e8; --warm:#e8dfd0; --accent:#c8520a; --accent2:#2a6b5c; --muted:#7a7068; --rule:#d4cbc0; --card:#faf7f3; --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --max:860px; --nav-h:56px; }
    html { scroll-behavior:smooth; }
    body { font-family:var(--sans); background:var(--sand); color:var(--ink); font-size:16px; line-height:1.65; min-height:100vh; }
    nav { position:fixed; top:0; left:0; right:0; height:var(--nav-h); background:rgba(245,240,232,0.92); backdrop-filter:blur(10px); z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; border-bottom:1px solid var(--rule); }
    .nav-name { font-family:var(--serif); font-size:1.05rem; color:var(--ink); text-decoration:none; }
    .back-link { font-size:0.82rem; font-weight:500; color:var(--muted); text-decoration:none; transition:color .2s; }
    .back-link:hover { color:var(--accent); }
    main { padding-top:var(--nav-h); }
    .page-wrap { max-width:var(--max); margin:0 auto; padding:4rem 2rem 6rem; }
    .page-label { font-size:0.7rem; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:0.6rem; display:block; }
    .page-title { font-family:var(--serif); font-size:clamp(2rem,5vw,3rem); font-weight:700; line-height:1.15; margin-bottom:2.5rem; }
    .quiz-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.4rem; }
    .quiz-card { background:var(--card); border:1px solid var(--rule); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; transition:all .22s; }
    .quiz-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 6px 24px rgba(200,82,10,.12); }
    .quiz-img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--warm); }
    .quiz-img-ph { width:100%; aspect-ratio:16/9; background:linear-gradient(135deg,var(--warm),var(--rule)); display:flex; align-items:center; justify-content:center; font-size:2.5rem; }
    .quiz-body { padding:1.1rem 1.2rem 1.3rem; display:flex; flex-direction:column; gap:0.4rem; flex:1; }
    .quiz-date { font-size:0.7rem; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
    .quiz-title { font-family:var(--serif); font-size:1rem; font-weight:700; color:var(--ink); line-height:1.3; display:flex; align-items:start; justify-content:space-between; gap:0.5rem; }
    .quiz-title span { flex:1; }
    .quiz-arrow { color:var(--muted); font-size:0.9rem; margin-top:2px; flex-shrink:0; transition:transform .2s; }
    .quiz-card:hover .quiz-arrow { transform:translate(2px,-2px); color:var(--accent); }
    .quiz-blurb { font-size:0.85rem; color:var(--muted); line-height:1.55; }
    .shelf-msg { color:var(--muted); font-size:0.9rem; font-style:italic; padding:2rem 0; }
    .fade-in { opacity:0; transform:translateY(18px); transition:opacity .5s ease, transform .5s ease; }
    .fade-in.visible { opacity:1; transform:none; }
    footer { background:var(--ink); border-top:1px solid rgba(255,255,255,.06); padding:1.2rem 2rem; text-align:center; font-size:0.75rem; color:rgba(245,240,232,.3); letter-spacing:0.04em; }
    @media (max-width:640px) { nav { padding:0 1rem; } .page-wrap { padding:3rem 1.2rem 4rem; } }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-name" id="nav-name">Samridh Kudesia</a>
  <a href="/" class="back-link">← Home</a>
</nav>
<main>
  <div class="page-wrap">
    <span class="page-label">Quizzes &amp; Tests</span>
    <h1 class="page-title">Quiz</h1>
    <div id="list"><p class="shelf-msg">Loading…</p></div>
  </div>
</main>
<footer><span id="footer-name">Samridh Kudesia</span> · Built with care</footer>
<script>
function getSbCreds(){return{url:localStorage.getItem('sb_url')||'',anon:localStorage.getItem('sb_anon')||''};}
async function sbGet(url,anon,table,qs=''){
  const res=await fetch(`${url}/rest/v1/${table}${qs}`,{headers:{apikey:anon,Authorization:`Bearer ${anon}`,Accept:'application/json'}});
  if(!res.ok)throw new Error(`${table} ${res.status}`);
  return res.json();
}
function observeFade(){
  const io=new IntersectionObserver((e)=>{e.forEach((en,i)=>{if(en.isIntersecting){setTimeout(()=>en.target.classList.add('visible'),i*55);io.unobserve(en.target);}});},{threshold:0.08});
  document.querySelectorAll('.fade-in:not(.visible)').forEach(el=>io.observe(el));
}
async function boot(){
  const {url,anon}=getSbCreds();
  if(!url||!anon){document.getElementById('list').innerHTML='<p class="shelf-msg">Open the <a href="/admin" style="color:var(--accent)">admin panel</a> and enter your Supabase credentials.</p>';return;}
  try{
    const [cfg,items]=await Promise.all([
      sbGet(url,anon,'site_config','?id=eq.main&select=hero'),
      sbGet(url,anon,'quiz','?order=updated_at.desc'),
    ]);
    const name=cfg[0]?.hero?.name||'Samridh Kudesia';
    document.getElementById('nav-name').textContent=name;
    document.getElementById('footer-name').textContent=name;
    document.title=`Quiz — ${name}`;
    const c=document.getElementById('list');
    if(!items.length){c.innerHTML='<p class="shelf-msg">No quizzes yet.</p>';return;}
    c.innerHTML=`<div class="quiz-grid">${items.map(q=>{
      const ds=q.date?new Date(q.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
      return `<a class="quiz-card fade-in" href="${q.link||'#'}" target="_blank" rel="noopener">
        ${q.image?`<img src="${q.image}" class="quiz-img" alt="${q.title}" loading="lazy"/>`:`<div class="quiz-img-ph">🧠</div>`}
        <div class="quiz-body">
          ${ds?`<div class="quiz-date">${ds}</div>`:''}
          <div class="quiz-title"><span>${q.title}</span><span class="quiz-arrow">↗</span></div>
          ${q.blurb?`<p class="quiz-blurb">${q.blurb}</p>`:''}
        </div>
      </a>`;
    }).join('')}</div>`;
    observeFade();
  }catch(e){document.getElementById('list').innerHTML=`<p class="shelf-msg">Could not load: ${e.message}</p>`;}
}
boot();
</script>
</body>
</html>
